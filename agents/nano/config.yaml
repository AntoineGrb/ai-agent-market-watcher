agent_id: NANO
company: Nanobiotix
context_updated_at: 2026-09-25
thesis: >
  Succès de la phase 3 NANORAY-312 (NCT04892173, promoteur J&J, NBTXR3 = JNJ-90301900 / JNJ-1900)
  dans le cancer de la tête et du cou localement avancé (LA-HNSCC).
  Critère principal : PFS (à confirmer dans le registre) ; OS = critère secondaire clé.

position:
  ticker: NANO
  isin: FR0011341205
  price_symbol: NANO.PA
  listing: Euronext Paris
  currency: EUR
  account: CTO
  budget_eur: 250
  status: OWNED
  entry_price: 22.55               
  entry_date: 2026-09-25                
  shares_outstanding: 50941528
  shares_outstanding_as_of: 2026-08-31

